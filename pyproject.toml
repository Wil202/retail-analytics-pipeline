[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-analytics-pipeline"
version = "0.1.0"
description = "Pipeline ELT de bout en bout sur le dataset Online Retail II (UCI) : validation, nettoyage, PostgreSQL, marts SQL, KPI et dashboard Streamlit."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2,<3",
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.46"]
mirror = ["pyreadr>=0.5"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
retail-pipeline = "retail_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests nécessitant une base PostgreSQL (TEST_DATABASE_URL)",
]
addopts = "-ra"
