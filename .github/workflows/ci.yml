# Intégration continue : exécute EXACTEMENT ce que le README demande de lancer en local.
# REQUIRE_DB=1 : si PostgreSQL n'est pas joignable, les tests d'intégration ÉCHOUENT (pas de suite verte trompeuse).
name: tests

# Déclenchement manuel uniquement (onglet Actions > tests > Run workflow).
# Pour l'exécuter à chaque push, remettre :  push:  et  pull_request:
on:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: retail
          POSTGRES_PASSWORD: ci_only_not_a_secret   # base jetable, détruite avec le runner
          POSTGRES_DB: retail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retail -d retail_test"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://retail:ci_only_not_a_secret@localhost:5432/retail_test
      DATABASE_URL: postgresql+psycopg://retail:ci_only_not_a_secret@localhost:5432/retail_test
      REQUIRE_DB: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt

      - name: Installer les dépendances (versions exactes)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt
          pip install -e .

      - name: Vérifier que l'échantillon versionné est reproductible
        run: python -m retail_analytics.cli generate-sample && git diff --exit-code data/sample/

      - name: Tests (unitaires + intégration PostgreSQL + dashboard)
        run: pytest -q
